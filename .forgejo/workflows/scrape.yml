name: Scrape
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Scraper mode"
        required: true
        type: choice
        options:
          - courses
          - programs
          - syllabi
          - ldap
          - soc
          - all
        default: all
      cookie_header:
        description: "Stellic `Cookie:` header value (not needed for soc)"
        required: false
        type: string
      canvas_token:
        description: "Canvas API token (required for syllabi, all)"
        required: false
        type: string

jobs:
  scrape:
    name: Scrape and upload
    runs-on: native
    enable-openid-connect: true
    env:
      SECRETSPEC_PROFILE: ci
      COOKIE_HEADER: ${{ inputs.cookie_header }}
      CANVAS_TOKEN: ${{ inputs.canvas_token }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
      - uses: https://git.cmu.dev/ScottyLabs/kennel/.forgejo/actions/prepare@main

      - name: Scrape
        run: devenv shell -- cargo run --release -p courses-scraper -- --mode ${{ inputs.mode }}

      # The catalog is built from the whole exported/ tree, not one run's output, and published encrypted with
      # scripts/publish_catalog.py: see sites/docs/src/api/data.md.

      - name: Upload syllabi to garage
        run: |
          if [ -d exported/syllabi ]; then
            devenv shell -- cdn-s3 sync exported/syllabi/ s3://cdn-courses/syllabi/
          fi
