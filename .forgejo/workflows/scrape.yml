name: Scrape and Publish Catalog
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Scraper mode"
        required: true
        type: choice
        options:
          - courses
          - programs
          - syllabi
          - ldap
          - all
        default: courses
      cookie_header:
        description: "Stellic `Cookie:` header value"
        required: true
        type: string
      canvas_token:
        description: "Canvas API token (required for syllabi, all)"
        required: false
        type: string

jobs:
  scrape:
    name: Scrape and prepare catalog release
    runs-on: native
    enable-openid-connect: true
    env:
      SECRETSPEC_PROFILE: ci
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7

      - name: Scrape
        env:
          SCRAPE_MODE: ${{ inputs.mode }}
          COOKIE_HEADER: ${{ inputs.cookie_header }}
          CANVAS_TOKEN: ${{ inputs.canvas_token }}
        run: nix develop --command cargo run --release -p courses-scraper -- --mode "$SCRAPE_MODE"

      - name: Build and verify SQLite catalogs
        if: inputs.mode == 'courses' || inputs.mode == 'all'
        run: |
          nix develop --command cargo run --locked --release -p courses-index -- \
            --import-catalog exported --output data/catalog
          nix develop --command python3 scripts/verify_catalog.py --root data/catalog

      - name: Publish encrypted catalog release
        if: inputs.mode == 'courses' || inputs.mode == 'all'
        run: |
          nix develop --command bash -euc '
            publisher_env=$(mktemp -d)
            cleanup() { rm -rf -- "$publisher_env"; }
            trap cleanup EXIT
            python3 -m venv "$publisher_env"
            "$publisher_env/bin/python" -m pip install -r scripts/publish-requirements.txt
            secretspec --reason "Publish verified CMU Courses catalog" run \
              -p openbao-ci -P ci -S catalog_publish -- \
              "$publisher_env/bin/python" scripts/publish_catalog.py
          '

      - name: Attach release manifest
        if: inputs.mode == 'courses' || inputs.mode == 'all'
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: catalog-release-manifest
          path: deployments/catalog.json
          if-no-files-found: error

      - name: Upload syllabi to garage
        run: |
          if [ -d exported/syllabi ]; then
            nix develop --command cdn-s3 sync exported/syllabi/ s3://cdn-courses/syllabi/
          fi
