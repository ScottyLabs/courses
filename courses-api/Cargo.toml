[package]
name = "courses-api"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.102"
arc-swap = "1.9.1"
aws-config = "1.8.16"
aws-sdk-s3 = "1.131.0"
axum = "0.8.9"
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
courses-index = { version = "0.1.0", path = "../courses-index" }
notify = "8.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["full"] }
tower-http = { version = "0.6.8", features = ["compression-gzip", "trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
