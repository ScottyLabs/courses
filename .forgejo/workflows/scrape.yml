name: Scrape and Publish Catalog
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Scraper mode"
        required: true
        type: choice
        options:
          - courses
          - programs
          - syllabi
          - ldap
          - all
        default: all
      cookie_header:
        description: "Stellic `Cookie:` header value"
        required: true
        type: string
      canvas_token:
        description: "Canvas API token (required for syllabi, all)"
        required: false
        type: string

jobs:
  scrape:
    name: Scrape and upload
    runs-on: native
    enable-openid-connect: true
    env:
      SECRETSPEC_PROFILE: ci
      COOKIE_HEADER: ${{ inputs.cookie_header }}
      CANVAS_TOKEN: ${{ inputs.canvas_token }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
      - uses: https://git.cmu.dev/ScottyLabs/kennel/.forgejo/actions/prepare@main

      - name: Scrape
        run: devenv shell -- cargo run --release -p courses-scraper -- --mode ${{ inputs.mode }}

      - name: Build catalog
        run: devenv shell -- cargo run --release -p courses-index -- --write-catalog catalog.bin

      - name: Upload to garage
        run: |
          devenv shell -- cdn-s3 cp catalog.bin s3://cdn-courses/catalog.bin \
            --content-type application/octet-stream \
            --content-encoding gzip

      - name: Upload syllabi to garage
        run: |
          if [ -d exported/syllabi ]; then
            devenv shell -- cdn-s3 sync exported/syllabi/ s3://cdn-courses/syllabi/
          fi
