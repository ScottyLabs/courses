[project]
name = "courses"
revision = "1.0"

[providers]
local = "dotenv://.env"
openbao = "openbao://secrets.scottylabs.org/secret"
openbao-ci = "openbao://secrets.scottylabs.org/secret?auth=jwt&role=ci&audience=openbao"

[profiles.default]
CATALOG_ENCRYPTION_KEY = { description = "Base64 AES-256 key for encrypted catalog releases", required = false }
SYLLABI_BUCKET = { description = "Private bucket holding syllabus files for the web API", required = false }
SYLLABI_PREFIX = { description = "Key prefix of syllabus files in SYLLABI_BUCKET (default syllabi/)", required = false }
SYLLABI_S3_ENDPOINT = { description = "S3 endpoint for SYLLABI_BUCKET (default https://s3.scottylabs.org)", required = false }
SYLLABI_ACCESS_KEY_ID = { description = "Read-only access key ID for SYLLABI_BUCKET", required = false }
SYLLABI_SECRET_ACCESS_KEY = { description = "Read-only secret access key for SYLLABI_BUCKET", required = false }
AWS_ACCESS_KEY_ID = { description = "sccache S3 access key ID", ref = { item = "shared/sccache", field = "AWS_ACCESS_KEY_ID" } }
AWS_SECRET_ACCESS_KEY = { description = "sccache S3 secret access key", ref = { item = "shared/sccache", field = "AWS_SECRET_ACCESS_KEY" } }
CACHIX_AUTH_TOKEN = { description = "Cachix auth token", ref = { item = "shared/cachix", field = "CACHIX_AUTH_TOKEN" } }
CDN_S3_ENDPOINT = { description = "S3 endpoint for the catalog CDN bucket" }
CDN_S3_BUCKET = { description = "CDN bucket holding catalog.bin" }
CDN_ACCESS_KEY_ID = { description = "CDN bucket access key ID" }
CDN_SECRET_ACCESS_KEY = { description = "CDN bucket secret access key" }
CDN_PUBLIC_URL = { description = "Public base URL for the CDN bucket" }
KEYCLOAK_URL = { description = "Keycloak base URL" }
KEYCLOAK_REALM = { description = "Keycloak realm name" }
OIDC_CLIENT_ID = { description = "OIDC client ID" }
OIDC_CLIENT_SECRET = { description = "OIDC client secret" }
OAUTH_RELAY_URL = { description = "OAuth relay callback URL" }
PROJECT_GROUP = { description = "Keycloak project group path" }
PROJECT_ADMIN_GROUP = { description = "Keycloak project admin group path" }

[profiles.prod]

[profiles.staging]

[profiles.preview]

[profiles.dev.defaults]
providers = ["openbao"]

[profiles.dev]
COOKIE_HEADER = { description = "Stellic session cookie header for the scraper", required = false, providers = [
  "local",
] }
CANVAS_TOKEN = { description = "Canvas API token for syllabi fetching", required = false, providers = [
  "local",
] }
CMU_LDAP_PASSWORD = { description = "CMU directory bind password for the scottylabs-svc service account", required = false, providers = [
  "local",
] }

[profiles.ci.defaults]
required = false
providers = ["openbao-ci"]

[profiles.ci]
CMU_LDAP_PASSWORD = { description = "CMU directory bind password for the scottylabs-svc service account", required = false }

[scopes.catalog_publish]
secrets = [
  "CATALOG_ENCRYPTION_KEY",
  "CDN_S3_ENDPOINT",
  "CDN_S3_BUCKET",
  "CDN_ACCESS_KEY_ID",
  "CDN_SECRET_ACCESS_KEY",
  "CDN_PUBLIC_URL",
]
