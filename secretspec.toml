[project]
name = "courses"
revision = "1.0"

[profiles.ci.defaults]
required = false

[profiles.default]
CDN_S3_ENDPOINT = { description = "S3 endpoint for the catalog CDN bucket" }
CDN_S3_BUCKET = { description = "CDN bucket holding catalog.bin" }
CDN_ACCESS_KEY_ID = { description = "CDN bucket access key ID" }
CDN_SECRET_ACCESS_KEY = { description = "CDN bucket secret access key" }
CDN_PUBLIC_URL = { description = "Public base URL for the CDN bucket" }
KEYCLOAK_URL = { description = "Keycloak base URL" }
KEYCLOAK_REALM = { description = "Keycloak realm name" }
OIDC_CLIENT_ID = { description = "OIDC client ID" }
OIDC_CLIENT_SECRET = { description = "OIDC client secret" }
OAUTH_RELAY_URL = { description = "OAuth relay callback URL" }
PROJECT_GROUP = { description = "Keycloak project group path" }
PROJECT_ADMIN_GROUP = { description = "Keycloak project admin group path" }
COOKIE_HEADER = { description = "Stellic session cookie header for the scraper", required = false }
CANVAS_TOKEN = { description = "Canvas API token for syllabi fetching", required = false }

