[project]
name = "courses"
revision = "1.0"

[profiles.dev]
COOKIE_HEADER = { description = "Stellic session cookie header for the scraper", required = false }
CANVAS_TOKEN = { description = "Canvas API token for syllabi fetching", required = false }
OIDC_CLIENT_ID = { description = "Keycloak OIDC client ID", default = "courses" }
OIDC_CLIENT_SECRET = { description = "Keycloak OIDC client secret", default = "dev-secret-not-for-prod" }
S3_BUCKET = { description = "S3 bucket holding catalog.bin", default = "courses-catalog" }
S3_ENDPOINT = { description = "S3/Garage endpoint URL" }

[profiles.prod]
OIDC_CLIENT_ID = { description = "Keycloak OIDC client ID" }
OIDC_CLIENT_SECRET = { description = "Keycloak OIDC client secret" }
S3_BUCKET = { description = "S3 bucket holding catalog.bin", default = "courses-catalog" }
S3_ENDPOINT = { description = "S3/Garage endpoint URL", default = "https://s3.scottylabs.org" }

[profiles.staging]
OIDC_CLIENT_ID = { description = "Keycloak OIDC client ID" }
OIDC_CLIENT_SECRET = { description = "Keycloak OIDC client secret" }
S3_BUCKET = { description = "S3 bucket holding catalog.bin", default = "courses-catalog" }
S3_ENDPOINT = { description = "S3/Garage endpoint URL", default = "https://s3.scottylabs.org" }

[profiles.preview]
OIDC_CLIENT_ID = { description = "Keycloak OIDC client ID" }
OIDC_CLIENT_SECRET = { description = "Keycloak OIDC client secret" }
S3_BUCKET = { description = "S3 bucket holding catalog.bin", default = "courses-catalog" }
