[package]
name = "courses-index"
version.workspace = true
edition.workspace = true

[[bin]]
name = "courses-index"
path = "src/bin/courses-index.rs"
required-features = ["cli"]

[features]
default = ["cli", "gzip_runtime"]
cli = []
# Pulls in flate2 so the runtime can auto-detect and decompress
# gzip-wrapped catalogs. Disabled by the browser wasm crate, which lets JS
# handle decompression via the native DecompressionStream API.
gzip_runtime = ["dep:flate2"]

[dependencies]
anyhow = "1.0.102"
bincode = { version = "2", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
csv = "1.4.0"
flate2 = { version = "1.1.9", optional = true }
fst = { version = "0.4.7", features = ["levenshtein"] }
rayon = "1.12.0"
regex = "1.12.3"
roaring = "0.11.4"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9.10"
zstd = "0.13.3"
