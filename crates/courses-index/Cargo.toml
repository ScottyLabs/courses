[package]
name = "courses-index"
version.workspace = true
edition.workspace = true

[[bin]]
name = "courses-index"
path = "src/bin/courses-index.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "env"] }
courses-catalog = { path = "../courses-catalog" }
flate2 = "1"
icu_collator = "2.3.1"
icu_normalizer = "2.3.0"
pdf-extract = "0.10"
rayon = "1.12.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
